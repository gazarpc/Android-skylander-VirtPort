<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Skylanders Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=8">
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Loading Collection...</div>
    </div>

    <div id="reset-overlay" class="overlay-hidden">
        <div class="reset-card premium-glass">
            <h2 id="reset-title" style="margin-top: 0;">Reset to Level 1?</h2>
            <p style="text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 20px;">Press and hold for 10 seconds to confirm. All modifications will be permanently lost.</p>
            <button id="reset-hold-btn" class="action-btn hold-btn">
                <span style="position: relative; z-index: 2;">Hold to Reset</span>
                <div id="reset-progress"></div>
            </button>
            <button id="reset-cancel-btn" class="action-btn" style="margin-top: 20px; background: rgba(255,255,255,0.1);">Cancel</button>
        </div>
    </div>

    <div id="combo-modal" class="overlay-hidden" role="dialog" aria-modal="true">
        <div class="combo-sheet">
            <div class="combo-head">
                <div id="combo-title" class="combo-title">Create combo</div>
                <button type="button" id="combo-close" class="combo-x">&times;</button>
            </div>

            <div class="combo-preview">
                <button type="button" class="combo-slot" data-part="top">
                    <span class="combo-slot-label">Top</span>
                    <span class="combo-slot-disc"><img alt="" draggable="false"><span class="combo-slot-empty">?</span></span>
                    <span class="combo-slot-name"></span>
                </button>
                <div class="combo-plus">+</div>
                <button type="button" class="combo-slot" data-part="bottom">
                    <span class="combo-slot-label">Bottom</span>
                    <span class="combo-slot-disc"><img alt="" draggable="false"><span class="combo-slot-empty">?</span></span>
                    <span class="combo-slot-name"></span>
                </button>
            </div>

            <div class="combo-result">
                <button type="button" id="combo-fav" class="combo-fav"><img alt=""></button>
                <div id="combo-summary" class="combo-summary"></div>
                <button type="button" id="combo-place" class="action-btn combo-place">Place on portal</button>
            </div>

            <div class="combo-picker">
                <input type="text" id="combo-search" class="combo-search" placeholder="Search...">
                <div id="combo-elements" class="lib-row-chips"></div>
                <div id="combo-grid"></div>
            </div>
        </div>
    </div>

    <div id="app">
        <div id="nav-header">
            <button id="back-btn" style="display:none;" onclick="goBack()">◀ Back</button>
            <div id="breadcrumb-container" onclick="goBack()">
                <span id="breadcrumb">Library</span>
            </div>
            <input type="text" id="search-bar" placeholder="Search...">
            <button id="disconnect-btn" onclick="disconnect()">Disconnect</button>
        </div>
        
        <div id="lib-tabs">
            <button class="lib-tab active" data-tab="library">Library</button>
            <button class="lib-tab" data-tab="favorites">&#9733; Favorites</button>
            <button class="lib-tab" data-tab="recents">Recents</button>
        </div>

        <div id="lib-browse">
            <span class="lib-browse-label">Browse by</span>
            <div class="lib-segmented">
                <button class="lib-seg active" data-by="game">Game</button>
                <button class="lib-seg" data-by="element">Element</button>
                <button class="lib-seg" data-by="type">Type</button>
            </div>
        </div>

        <div id="lib-filters"></div>

        <div id="lib-empty"></div>

        <div id="drill-down-container"></div>
        
        <main id="skylanders-grid" style="display:none;"></main>
    </div>

    <div id="portal-backdrop"></div>

    <div id="portal-container">
        <div id="portal-base"></div>

        <button type="button" class="pb-head" aria-expanded="false">
            <span class="pb-line"></span>
            <span class="pb-pill">
                <span class="pb-count">0/8</span>
                <svg class="pb-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 5 L5 1 L9 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="pb-line"></span>
        </button>
        <div id="portal-mini"></div>

        <div id="portal-sheet">
            <button type="button" class="pb-head" aria-expanded="false">
                <span class="pb-line"></span>
                <span class="pb-pill">
                    <span class="pb-count">0/8</span>
                    <svg class="pb-chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 5 L5 1 L9 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="pb-line"></span>
            </button>
            <div id="portal-grid"></div>
        </div>
    </div>

    <div id="slot-modal" class="overlay-hidden" role="dialog" aria-modal="true">
        <div class="slot-modal-card">
            <button type="button" id="slot-modal-close" class="slot-modal-x">&times;</button>
            <div id="slot-modal-ring" class="circle-img-container premium-glass-img">
                <img id="slot-modal-img" alt="">
                <span id="slot-modal-villain" class="trap-badge"></span>
            </div>
            <div id="slot-modal-name"></div>
            <div id="slot-modal-realname"></div>
            <div id="slot-modal-stats" class="pb-stats"></div>
            <div id="slot-modal-info"></div>
            <div class="slot-modal-actions">
                <button type="button" id="slot-modal-remove" class="action-btn slot-remove-btn">Remove from portal</button>
                <button type="button" id="slot-modal-remove-both" class="action-btn slot-remove-btn slot-remove-both">Remove both</button>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/crypto-js.js"></script>
    <script src="js/decoder.js?v=4"></script>
    <script src="js/storage.js?v=4"></script>
    <script src="js/library.js?v=4"></script>
    <script src="js/traps.js?v=1"></script>
    <script src="js/swap.js?v=1"></script>
    <script src="js/portal.js?v=3"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
